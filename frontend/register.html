<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register &mdash; STREETFLOW LIVE</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="theme.css"/>
  <script type="module" src="firebase-init.js"></script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card glass-card">
    <div class="auth-brand">
      <a class="brand" href="landing.html">STREETFLOW<span>_LIVE</span></a>
      <div class="subtitle">Create Operator Account</div>
    </div>
    <form id="registerForm" class="form-stack" novalidate>
      <div class="form-group">
        <label class="form-label" for="regName">Full Name</label>
        <input class="form-input" type="text" id="regName" name="name"
               placeholder="Operator Name" autocomplete="name"/>
      </div>
      <div class="form-group">
        <label class="form-label" for="regEmail">Email</label>
        <input class="form-input" type="email" id="regEmail" name="email"
               placeholder="operator@streetflow.io" autocomplete="email"/>
      </div>
      <div class="form-group">
        <label class="form-label" for="regPassword">Password</label>
        <input class="form-input" type="password" id="regPassword" name="password"
               placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="new-password"/>
      </div>
      <div class="form-group">
        <label class="form-label" for="regConfirm">Confirm Password</label>
        <input class="form-input" type="password" id="regConfirm" name="confirm"
               placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="new-password"/>
      </div>
      <div class="form-err" id="registerErr" aria-live="polite"></div>
      <button type="submit" class="btn-primary" id="registerBtn">Create Account</button>
      <div class="form-footer">Already have an account? <a href="login.html">Sign In</a></div>
      <div class="form-footer"><a href="landing.html">&larr; Back to Landing</a></div>
    </form>
  </div>
</div>
<script type="module">
  import {
    auth,
    createUserWithEmailAndPassword
  } from './firebase-init.js';

  document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const nameInput    = document.getElementById('regName');
    const emailInput   = document.getElementById('regEmail');
    const passInput    = document.getElementById('regPassword');
    const confirmInput = document.getElementById('regConfirm');
    const errEl        = document.getElementById('registerErr');
    const btn          = document.getElementById('registerBtn');

    const name     = nameInput.value.trim();
    const email    = emailInput.value.trim();
    const password = passInput.value;
    const confirm  = confirmInput.value;

    errEl.textContent = '';
    errEl.style.color = '#ff5252';

    if (!name) {
      errEl.textContent = 'Please enter your full name.';
      return;
    }
    if (!email) {
      errEl.textContent = 'Please enter your email.';
      return;
    }
    if (!password) {
      errEl.textContent = 'Please enter a password.';
      return;
    }
    if (password !== confirm) {
      errEl.textContent = 'Passwords do not match.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Creating Account...';

    try {
      console.log('[REGISTER] Creating Firebase Auth account for:', email);
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      console.log('[REGISTER SUCCESS] User created. UID:', userCredential.user.uid);

      // Redirect to dashboard
      window.location.href = 'dashboard.html';
    } catch (error) {
      console.error('[REGISTER ERROR]', error);
      btn.disabled = false;
      btn.textContent = 'Create Account';

      let msg = error.message || 'Registration failed.';
      if (error.code === 'auth/email-already-in-use') {
        msg = 'This email address is already registered.';
      } else if (error.code === 'auth/weak-password') {
        msg = 'Password should be at least 6 characters.';
      } else if (error.code === 'auth/invalid-email') {
        msg = 'Invalid email address format.';
      }
      errEl.textContent = msg;
    }
  });
</script>
</body>
</html>
