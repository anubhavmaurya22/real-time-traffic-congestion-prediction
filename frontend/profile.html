<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile &mdash; STREETFLOW LIVE</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="theme.css"/>
  <script type="module" src="firebase-init.js"></script>
  <style>
    .profile-wrap { max-width: 560px; display: flex; flex-direction: column; gap: 20px; }
    .profile-head { display: flex; align-items: center; gap: 20px; margin-bottom: 8px; }
    .avatar-ring {
      width: 72px; height: 72px; border-radius: 50%;
      background: var(--primary-container); border: 2px solid var(--outline-var);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .avatar-init { font-size: 28px; font-weight: 700; color: var(--on-primary); }
    .profile-title h1 { font-size: 22px; font-weight: 600; color: var(--on-surface); letter-spacing: -.02em; }
    .profile-title p { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--on-surface-var); margin-top: 4px; }
    .fields { display: flex; flex-direction: column; gap: 14px; margin-top: 4px; }
    .btn-row { display: flex; gap: 10px; padding-top: 12px; }
    .btn-sm {
      padding: 9px 18px; background: none; border: 1px solid var(--outline-var);
      color: var(--on-surface-var); font-family: var(--font-mono); font-size: 11px;
      font-weight: 500; letter-spacing: .1em; text-transform: uppercase;
      border-radius: 2px; cursor: pointer; transition: border-color .15s, color .15s;
    }
    .btn-sm:hover { border-color: var(--primary); color: var(--primary); }
    .stub-note { font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; color: var(--outline); margin-top: 10px; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-left">
      <a class="brand" href="landing.html">STREETFLOW<span>_LIVE</span></a>
      <nav class="top-nav">
        <a href="dashboard.html" id="nav-livemap">Live Map</a>
        <a href="simple-map.html" id="nav-sensorgrid">Sensor Grid</a>
        <a href="profile.html" class="active" id="nav-profile">Profile</a>
      </nav>
    </div>
    <div class="header-right">
      <div class="live-badge"><div class="dot"></div><span class="label">Live Sync</span></div>
      <a href="profile.html" class="header-icon-link" title="Profile">
        <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 0;">account_circle</span>
      </a>
    </div>
  </header>
  <div class="body-wrap">
    <aside class="sidebar">
      <div class="system-id">
        <div class="icon-wrap"><span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">power_settings_new</span></div>
        <div><h2>STRATOS_v2.4</h2><p>Prediction Engine</p></div>
      </div>
      <nav class="side-nav">
        <a href="#" id="sn-command"><span class="material-symbols-outlined">dashboard</span>Command</a>
        <a href="dashboard.html" id="sn-map"><span class="material-symbols-outlined">map</span>Live Map</a>
        <a href="simple-map.html" id="sn-sensorgrid"><span class="material-symbols-outlined">layers</span>Sensor Grid</a>
        <a href="profile.html" class="active" id="sn-profile"><span class="material-symbols-outlined">person</span>Profile</a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-links">
          <a href="landing.html"><span class="material-symbols-outlined">logout</span>Sign Out</a>
        </div>
      </div>
    </aside>
    <main>
      <div class="profile-wrap">
        <span class="card-tag">User Profile</span>
        <div class="glass-card">
          <div class="profile-head">
            <div class="avatar-ring">
              <span class="avatar-init" id="avatarInit">U</span>
            </div>
            <div class="profile-title">
              <h1 id="displayName">Operator Name</h1>
              <p id="displayRole">Analyst</p>
            </div>
          </div>
          <div class="fields">
            <div class="form-group">
              <label class="form-label" for="pName">Display Name</label>
              <input class="form-input" type="text" id="pName"
                     value="Operator Name" readonly placeholder="Your name"/>
            </div>
            <div class="form-group">
              <label class="form-label" for="pEmail">Email</label>
              <input class="form-input" type="email" id="pEmail"
                     value="operator@streetflow.io" readonly placeholder="Your email"/>
            </div>
            <div class="form-group">
              <label class="form-label" for="pRole">Role</label>
              <input class="form-input" type="text" id="pRole"
                     value="Analyst" readonly placeholder="Role"/>
            </div>
          </div>
          <div class="btn-row">
            <button class="btn-sm" id="editBtn" onclick="startEdit()">Edit Profile</button>
            <button class="btn-sm" id="saveBtn" style="display:none;" onclick="saveEdit()">Save</button>
            <button class="btn-sm" id="cancelBtn" style="display:none;" onclick="cancelEdit()">Cancel</button>
          </div>
          <div class="stub-note" id="stubNote">Edit is a UI placeholder &mdash; no persistence yet.</div>
        </div>
      </div>
    </main>
  </div>
</div>
<script type="module">
  import {
    auth,
    onAuthStateChanged,
    signOut
  } from './firebase-init.js';

  let currentUser = null;
  let prevValues  = {};
  const FIELDS    = ['pName', 'pEmail', 'pRole'];

  // Listen to Auth State
  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      console.log('[PROFILE] Logged in as:', user.email, '| UID:', user.uid);
      const name = user.displayName || user.email.split('@')[0];

      document.getElementById('pName').value = name;
      document.getElementById('pEmail').value = user.email || '';
      document.getElementById('displayName').textContent = name;
      document.getElementById('avatarInit').textContent = name.charAt(0).toUpperCase();

      document.getElementById('stubNote').textContent = 'Profile loaded from session.';
    } else {
      console.log('[PROFILE] No user signed in.');
      document.getElementById('stubNote').textContent = 'Not signed in. Please sign in or create an account.';
    }
  });

  window.startEdit = function() {
    prevValues = {};
    FIELDS.forEach((id) => {
      const el = document.getElementById(id);
      prevValues[id] = el.value;
      if (id !== 'pEmail') { // Keep email read-only
        el.removeAttribute('readonly');
        el.style.borderColor = 'var(--primary)';
      }
    });
    document.getElementById('editBtn').style.display = 'none';
    document.getElementById('saveBtn').style.display = '';
    document.getElementById('cancelBtn').style.display = '';
    document.getElementById('stubNote').textContent = 'Editing profile...';
  };

  window.saveEdit = function() {
    const name = document.getElementById('pName').value.trim() || 'Operator Name';
    const role = document.getElementById('pRole').value.trim() || 'Operator / Analyst';

    FIELDS.forEach((id) => {
      const el = document.getElementById(id);
      el.setAttribute('readonly', '');
      el.style.borderColor = '';
    });

    document.getElementById('displayName').textContent = name;
    document.getElementById('displayRole').textContent = role;
    document.getElementById('avatarInit').textContent = name.charAt(0).toUpperCase();
    document.getElementById('editBtn').style.display = '';
    document.getElementById('saveBtn').style.display = 'none';
    document.getElementById('cancelBtn').style.display = 'none';
    document.getElementById('stubNote').textContent = 'Profile updated.';
  };

  window.cancelEdit = function() {
    FIELDS.forEach((id) => {
      const el = document.getElementById(id);
      if (prevValues[id] !== undefined) el.value = prevValues[id];
      el.setAttribute('readonly', '');
      el.style.borderColor = '';
    });
    document.getElementById('editBtn').style.display = '';
    document.getElementById('saveBtn').style.display = 'none';
    document.getElementById('cancelBtn').style.display = 'none';
    document.getElementById('stubNote').textContent = 'Edit cancelled.';
  };

  // Attach Sign Out listener
  document.querySelectorAll('a[href="landing.html"]').forEach((link) => {
    if (link.textContent.includes('Sign Out')) {
      link.addEventListener('click', async (e) => {
        e.preventDefault();
        try {
          await signOut(auth);
          console.log('[AUTH] Signed out.');
          window.location.href = 'landing.html';
        } catch (err) {
          console.error('[AUTH SIGNOUT ERROR]', err);
          window.location.href = 'landing.html';
        }
      });
    }
  });
</script>
</body>
</html>
