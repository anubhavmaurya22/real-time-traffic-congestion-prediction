<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In &mdash; STREETFLOW LIVE</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="theme.css"/>
  <script type="module" src="firebase-init.js"></script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card glass-card">
    <div class="auth-brand">
      <a class="brand" href="landing.html">STREETFLOW<span>_LIVE</span></a>
      <div class="subtitle">Operational Sign In</div>
    </div>
    <form id="loginForm" class="form-stack" novalidate>
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email or Username</label>
        <input class="form-input" type="text" id="loginEmail" name="email"
               placeholder="operator@streetflow.io" autocomplete="username"/>
      </div>
      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <input class="form-input" type="password" id="loginPassword" name="password"
               placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password"/>
      </div>
      <div class="form-err" id="loginErr" aria-live="polite"></div>
      <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
      <div class="form-footer">No account? <a href="register.html">Register</a></div>
      <div class="form-footer"><a href="landing.html">&larr; Back to Landing</a></div>
    </form>
  </div>
</div>
<script type="module">
  import {
    auth,
    db,
    signInWithEmailAndPassword,
    ref,
    get,
    child
  } from './firebase-init.js';

  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const emailInput = document.getElementById('loginEmail');
    const passInput  = document.getElementById('loginPassword');
    const errEl      = document.getElementById('loginErr');
    const btn        = document.getElementById('loginBtn');

    const email    = emailInput.value.trim();
    const password = passInput.value;

    errEl.textContent = '';
    errEl.style.color = '#ff5252';

    if (!email || !password) {
      errEl.textContent = 'Please enter both email and password.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Signing In...';

    try {
      console.log('[LOGIN] Authenticating user:', email);
      // 1. Firebase Authentication
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;
      console.log('[LOGIN SUCCESS] Auth user signed in. UID:', user.uid);

      // 2. Fetch User Document from Realtime Database at `users/${user.uid}`
      const userPath = `users/${user.uid}`;
      console.log('[LOGIN DB READ] Fetching profile from path:', userPath);
      const snapshot = await get(child(ref(db), userPath));

      if (snapshot.exists()) {
        console.log('[LOGIN DB SUCCESS] User profile retrieved from Realtime Database:', snapshot.val());
      } else {
        console.warn('[LOGIN DB WARNING] User authenticated, but no database record found at path:', userPath);
      }

      // 3. Redirect to dashboard
      window.location.href = 'dashboard.html';
    } catch (error) {
      console.error('[LOGIN ERROR]', error);
      btn.disabled = false;
      btn.textContent = 'Sign In';

      let msg = error.message || 'Authentication failed.';
      if (
        error.code === 'auth/user-not-found' ||
        error.code === 'auth/wrong-password' ||
        error.code === 'auth/invalid-credential'
      ) {
        msg = 'Invalid email or password.';
      } else if (error.code === 'auth/invalid-email') {
        msg = 'Invalid email address format.';
      } else if (error.code === 'PERMISSION_DENIED') {
        msg = 'Database read permission denied by security rules.';
      }
      errEl.textContent = msg;
    }
  });
</script>
</body>
</html>
