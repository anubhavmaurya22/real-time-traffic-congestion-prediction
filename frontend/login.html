<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In &mdash; STREETFLOW LIVE</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="theme.css"/>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card glass-card">
    <div class="auth-brand">
      <a class="brand" href="landing.html">STREETFLOW<span>_LIVE</span></a>
      <div class="subtitle">Operational Sign In</div>
    </div>
    <form id="loginForm" class="form-stack" novalidate>
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email or Username</label>
        <input class="form-input" type="text" id="loginEmail" name="email"
               placeholder="operator@streetflow.io" autocomplete="username"/>
      </div>
      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <input class="form-input" type="password" id="loginPassword" name="password"
               placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password"/>
      </div>
      <div class="form-err" id="loginErr" aria-live="polite"></div>
      <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
      <div class="form-footer">No account? <a href="register.html">Register</a></div>
      <div class="form-footer"><a href="landing.html">&larr; Back to Landing</a></div>
    </form>
  </div>
</div>
<script>
  // STUB: No auth backend exists yet.
  // Logs form values to the browser console only, then redirects to dashboard.
  // Does NOT check credentials against any backend or local store.
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var email    = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value;
    console.log('[LOGIN STUB] email:', email, '| password length:', password.length);
    window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
